name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          unzip -q journeymod-src.zip
          cd journeymod
          sed -i 's/ItemStack.LIST_STREAM_CODEC/ItemStack.OPTIONAL_LIST_STREAM_CODEC/' src/main/java/com/journeymod/net/SyncPayload.java
          chmod +x gradlew
          ./gradlew build 2>&1 | tee build.log; grep -E "error:" -A2 build.log || true; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: journeymod-jar
          path: journeymod/build/libs/*.jar
